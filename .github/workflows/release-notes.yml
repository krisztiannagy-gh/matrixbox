name: Release notes

# Creates a GitHub release (with tag and notes) for every entry in
# docs/releases/releases.json that doesn't have one yet. Runs when release notes
# change on main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["docs/releases/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          rels = json.load(open("docs/releases/releases.json"))
          have = set(subprocess.check_output(
              ["gh", "release", "list", "--limit", "500", "--json", "tagName", "-q", ".[].tagName"]).decode().split())
          for i, r in enumerate(rels):
              if r["tag"] in have:
                  continue
              cmd = ["gh", "release", "create", r["tag"], "--target", r["commit"],
                     "--title", r["title"], "--notes-file", "docs/releases/" + r["notes"]]
              cmd.append("--latest" if i == len(rels) - 1 else "--latest=false")
              print("creating", r["tag"])
              subprocess.check_call(cmd)
          PY
